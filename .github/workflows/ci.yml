name: CI

on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest tests -q --durations=5
      - name: Benchmark the API
        run: python -m pytest tests/test_network.py::test_api_contract_and_performance -q

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: fiber-atlas-dist
          path: frontend/dist
          retention-days: 7

  browser:
    name: Browser flows (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        run: pip install -r requirements.txt
      - name: Install the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the browser flows
        working-directory: frontend
        run: npx playwright test --project=chromium-desktop --project=chromium-mobile
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
